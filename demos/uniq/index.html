  :root{
    --side-bg:#0A0B0E; --side-border:rgba(255,255,255,0.08); --side-ink:#E7E8EC; --side-muted:#7B7F8C;
    --bg:#F6F7FA; --surface:#FFFFFF; --border:#E7E9EF; --border-strong:#D6DAE3; --ink:#12141C; --muted:#6B7280;
    --blue:#2554FF; --pink:#FF3D8E; --green:#16A34A; --amber:#D97706; --red:#DC2626; --purple:#7C3AED;
  }
  * { box-sizing: border-box; }
  html,body{ margin:0; padding:0; background:var(--bg); color:var(--ink); font-family:'Inter',sans-serif; }
  .mono { font-family: 'JetBrains Mono', monospace; }
  .display { font-family: 'Manrope', sans-serif; letter-spacing: -0.02em; }
  .eyebrow { font-family: 'JetBrains Mono', monospace; font-size: 11px; letter-spacing: 0.12em; text-transform: uppercase; }
  .navbtn:hover { background: rgba(255,255,255,0.05); color: var(--side-ink) !important; }
  .card { background: var(--surface); border: 1px solid var(--border); border-radius: 8px; }
  .btn-primary { background: var(--ink); color: white; border: none; border-radius: 6px; padding: 9px 16px; font-weight: 600; font-size: 13px; cursor: pointer; }
  .btn-primary:hover { opacity: 0.85; }
  .btn-primary[disabled] { opacity: 0.3; cursor: not-allowed; }
  .chip { border: 1px solid var(--border-strong); border-radius: 6px; padding: 7px 12px; cursor: pointer; font-size: 12px; color: var(--muted); font-family: 'JetBrains Mono', monospace; transition: all .15s; background: white; display:inline-flex; align-items:center; }
  .chip.active { background: rgba(37,84,255,0.07); border-color: var(--blue); color: var(--blue); }
  .liveDot { width: 6px; height: 6px; border-radius: 999px; background: var(--green); box-shadow: 0 0 0 3px rgba(61,220,132,0.18); display:inline-block; }
  .row-hover:hover { background: #FAFBFC; }
  .assign-btn { border: 1px solid var(--border-strong); background: white; color: var(--ink); border-radius: 6px; padding: 5px 12px; font-size: 12px; cursor: pointer; }
  .assign-btn:hover { border-color: var(--blue); color: var(--blue); }
  .badge { font-size: 10.5px; font-weight: 600; padding: 2px 8px; border-radius: 999px; font-family: 'JetBrains Mono', monospace; display:inline-block; }
  .bump-btn { border: 1px solid var(--border-strong); background: white; border-radius: 4px; width: 20px; height: 20px; font-size: 12px; line-height: 1; cursor: pointer; color: var(--muted); }
  button { font-family: inherit; }
  #app { display: flex; min-height: 100vh; }
  aside { width: 232px; background: var(--side-bg); border-right: 1px solid var(--side-border); padding: 20px 14px; flex-shrink: 0; overflow-y: auto; }
  main { flex: 1; padding: 36px 44px; overflow: auto; }
  svg { display:block; }
</style>
</head>

}

/* ============ HELPERS ============ */
function hashSeed(str){ var h=0; for(var i=0;i<str.length;i++) h=(h*31+str.charCodeAt(i))>>>0; return h; }
function buildInventory(){
  var inv={};
  CITIES.forEach(function(city){
    inv[city]={};
    ITEM_TYPES.forEach(function(it){
      inv[city][it.key]={
        requerido:(hashSeed(city+it.key+"r")%4)+2,
        uniq:hashSeed(city+it.key+"u")%3,
        cliente:hashSeed(city+it.key+"c")%3
      };
    });
  });
  return inv;
}
function initials(name){ return name.split(" ").map(function(p){return p[0];}).slice(0,2).join("").toUpperCase(); }
function avatarHTML(name,size){
  size = size||34;
  var color = AVATAR_COLORS[name.length % AVATAR_COLORS.length];
  return '<div style="width:'+size+'px;height:'+size+'px;border-radius:999px;background:'+color+';color:white;display:flex;align-items:center;justify-content:center;font-size:'+(size*0.36)+'px;font-weight:700;font-family:\'Manrope\',sans-serif;flex-shrink:0;">'+initials(name)+'</div>';
}
function pad2(n){ return String(n).padStart(2,"0"); }
function countFaltantes(inv, cities){
  var count=0;
  cities.forEach(function(city){
    ITEM_TYPES.forEach(function(it){
      var d = inv[city] && inv[city][it.key];
      if(d && (d.uniq+d.cliente) < d.requerido) count++;
    });
  });
  return count;
}
function esc(s){ return (s==null?'':String(s)).replace(/[&<>"']/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }

/* ============ STATE ============ */
var state = {
  view: "dashboard",
  selectedCities: [],
  selectedClientId: null,
  taskTypes: ["Muestreo"],
  activationLive: false,
  assignments: {},
  testigos: {},
  pagos: {},
  inv: buildInventory(),
  invCity: null,
  promoFilterCity: null
};

function getSelectedClient(){ return CLIENTS.find(function(c){return c.id===state.selectedClientId;}) || null; }
function getCoveragePct(){
  return state.selectedCities.length
    ? Math.round((Object.keys(state.assignments).length / state.selectedCities.length) * 100)
    : 0;
}
function candidatesFor(city){
  return PROMOTORAS.filter(function(p){return p.city===city;}).sort(function(a,b){return b.rating-a.rating;});
}

/* ============ SIDEBAR ============ */
function sidebarHTML(){

        icon(n.icon,14, active?group.accent:'#7B7F8C')+
        '<span>'+esc(n.label)+'</span>'+
      '</button>';
    }).join('');
    return '<div><div class="eyebrow" style="color:#7B7F8C;padding:0 10px;margin-bottom:6px;">'+esc(group.title)+'</div>'+
      '<div style="display:flex;flex-direction:column;gap:1px;">'+items+'</div></div>';
  }).join('<div style="height:14px;"></div>');

  var statusText = state.activationLive
    ? (selectedClient ? esc(selectedClient.name) : '') + ' · ' + state.selectedCities.length + ' ubicaciones'
    : 'sin activación en curso';

  return '<aside>'+
    '<div style="display:flex;align-items:center;gap:8px;padding:0 8px;margin-bottom:22px;">'+

    '<div style="margin-top:22px;padding:12px;border-radius:8px;border:1px solid rgba(255,255,255,0.08);">'+

      '<div class="mono" style="font-size:11px;color:'+(state.activationLive?'#E7E8EC':'#7B7F8C')+';">'+statusText+'</div>'+

/* ============ DASHBOARD ============ */
function dashboardHTML(){

  var coveragePct = getCoveragePct();
  var activeRow = selectedClient ? {
    client: selectedClient.name, brand: selectedClient.projectLabel,
    status: !state.activationLive ? "sin crear" : (coveragePct === 100 ? "confirmada" : "asignando")
  } : null;
  var otherRows = CLIENTS.filter(function(c){return c.id !== (selectedClient?selectedClient.id:null);}).slice(0,2).map(function(c){
    return {client:c.name, brand:c.projectLabel, cities:c.mockCities, status:c.mockStatus};
  });
  var statusColor = {"confirmada":GREEN,"asignando":AMBER,"conflicto":RED,"sin crear":MUTED,"cubierta":GREEN,"asignada · sin testigo":AMBER,"sin asignar":RED};

  var sinAsignar = state.selectedCities.length - Object.keys(state.assignments).length;
  var testigosFaltan = Object.keys(state.assignments).length - Object.values(state.testigos).filter(Boolean).length;
  var inventarioFaltantes = countFaltantes(state.inv, state.selectedCities);

  var alerts = [
    sinAsignar>0 ? {label: sinAsignar+" ubicación(es) sin promotora asignada", icon:"users", color:RED, view:"asignacion"} : null,
    inventarioFaltantes>0 ? {label: inventarioFaltantes+" ítem(s) con inventario faltante", icon:"package", color:AMBER, view:"inventario"} : null,
    testigosFaltan>0 ? {label: testigosFaltan+" testigo(s) sin subir hoy", icon:"upload", color:AMBER, view:"vistapromotora"} : null
  ].filter(Boolean);

  var alertsHTML = alerts.length===0
    ? '<div style="font-size:13px;color:'+GREEN+';display:flex;align-items:center;gap:6px;">'+icon('check',14)+' Sin pendientes urgentes — todo al día.</div>'
    : '<div style="display:flex;flex-direction:column;gap:4px;">'+alerts.map(function(a){
        return '<button data-action="setView" data-view="'+a.view+'" class="row-hover" style="display:flex;align-items:center;justify-content:space-between;width:100%;background:none;border:none;cursor:pointer;padding:8px 10px;border-radius:6px;text-align:left;">'+
          '<span style="display:flex;align-items:center;gap:8px;font-size:13px;color:'+INK+';">'+icon(a.icon,14,a.color)+' '+esc(a.label)+'</span>'+
          icon('arrowRight',12,MUTED)+
        '</button>';
      }).join('')+'</div>';

  var activeRowHTML = '';
  if(activeRow){
    var citiesHTML = '';
    if(state.selectedCities.length>0){
      citiesHTML = '<div style="display:flex;flex-direction:column;gap:5px;padding-left:4px;">'+
        state.selectedCities.map(function(city){
          var isAssigned = !!state.assignments[city];

/* ============ CALENDARIO ============ */
function calendarioHTML(){
  var selectedClient = getSelectedClient();

    ? [selectedClient].concat(CLIENTS.filter(function(c){return c.id!==selectedClient.id;}).slice(0,3))
    : CLIENTS.slice(0,4);

      return Object.assign({},c,{days:days});

  var assignedCities = state.selectedCities.filter(function(c){return state.assignments[c];});
  var city = assignedCities[0];
  var promo = city ? PROMOTORAS.find(function(p){return p.id===state.assignments[city];}) : null;

  var inner;
  if(promo){
    var tasksHTML = state.taskTypes.map(function(t){
      return '<div style="border:1px solid #E7E9EF;border-radius:8px;padding:9px 11px;background:#FAFBFC;">'+
        '<div style="font-weight:700;font-size:12.5px;margin-bottom:3px;">'+esc(t)+'</div>'+
        '<div style="font-size:11.5px;color:'+MUTED+';line-height:1.5;">'+TASK_DESCRIPTIONS[t]+'</div>'+
      '</div>';
    }).join('');

    var testigoBlock = state.testigos[city]
      ? '<div style="border:1px solid rgba(22,163,74,0.25);background:rgba(22,163,74,0.06);border-radius:6px;padding:12px;text-align:center;">'+icon('check',16,GREEN)+'<div class="mono" style="font-size:12px;font-weight:500;color:'+GREEN+';margin-top:3px;">testigo subido</div></div>'
      : '<button class="btn-primary" data-action="uploadTestigo" data-city="'+esc(city)+'" style="width:100%;display:flex;justify-content:center;align-items:center;gap:6px;">'+icon('upload',13)+' Subir testigo del día</button>';

    inner = '<div class="eyebrow" style="color:'+MUTED+';margin-bottom:4px;">CLIENTE</div><div style="font-weight:600;margin-bottom:14px;font-size:13.5px;">'+esc(selectedClient?selectedClient.name:'')+'</div>'+
      '<div class="eyebrow" style="color:'+MUTED+';margin-bottom:4px;">UBICACIÓN</div><div style="font-weight:600;margin-bottom:14px;font-size:13.5px;">'+esc(city)+'</div>'+
      '<div class="eyebrow" style="color:'+MUTED+';margin-bottom:4px;">UNIFORME</div><div style="font-weight:600;margin-bottom:14px;font-size:13.5px;">'+esc(selectedClient?selectedClient.uniforme:'')+'</div>'+
      '<div class="eyebrow" style="color:'+MUTED+';margin-bottom:6px;">QUÉ DEBES HACER</div>'+
      '<div style="display:flex;flex-direction:column;gap:8px;margin-bottom:20px;">'+tasksHTML+'</div>'+
      testigoBlock;
  } else {
    inner = '<div style="font-size:12.5px;color:'+MUTED+';text-align:center;margin-top:40px;">Asigna una promotora en la pestaña "Asignación" para activar esta vista.</div>';
  }

  return headerHTML("PASO 04 / 04","Vista de la Promotora","Lo que ve la promotora en su celular el día del evento.")+
    '<div style="width:290px;margin:0 auto;border:1px solid #D6DAE3;border-radius:20px;overflow:hidden;background:white;box-shadow:0 12px 30px rgba(18,20,28,0.08);">'+
      '<div style="padding:18px 18px 14px;border-bottom:1px solid #E7E9EF;position:relative;">'+
        '<div style="position:absolute;top:0;left:0;right:0;height:2px;background:linear-gradient(135deg,'+BLUE+','+PINK+');"></div>'+
        '<div class="mono" style="font-size:11px;color:'+MUTED+';margin-bottom:4px;">HOY · SÁBADO</div>'+
        '<div class="display" style="font-size:16px;font-weight:800;color:'+INK+';">'+esc(promo?promo.name:'Sin activación asignada')+'</div>'+
      '</div>'+
      '<div style="padding:18px;min-height:260px;">'+inner+'</div>'+
    '</div>';
}

/* ============ REPORTES ============ */
function reportesHTML(){
  var selectedClient = getSelectedClient();
  var testigosCount = Object.values(state.testigos).filter(Boolean).length;
  var clientName = selectedClient ? selectedClient.name : "el cliente";
  var coveragePct = getCoveragePct();

  return headerHTML("RESULTADO","Reporte Automático","Generado sin intervención manual — lo que hoy toma horas armar en Excel.")+
    '<div style="display:flex;gap:12px;margin-bottom:22px;">'+
      statCardHTML("COBERTURA TOTAL", pad2(coveragePct)+"%", coveragePct===100?GREEN:BLUE)+
      statCardHTML("UBICACIONES CUBIERTAS", Object.keys(state.assignments).length+"/"+(state.selectedCities.length||0))+
      statCardHTML("TESTIGOS RECIBIDOS", pad2(testigosCount))+
    '</div>'+
    '<div class="card" style="padding:22px;">'+
      '<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;">'+
        '<div style="font-weight:700;font-size:14.5px;">Resumen ejecutivo — '+esc(clientName)+'</div>'+
        '<button class="btn-primary" style="display:flex;align-items:center;gap:6px;">'+icon('fileBarChart',13)+' Descargar PDF</button>'+
      '</div>'+
      '<div style="font-size:13.5px;color:'+MUTED+';line-height:1.75;">'+
        'Este fin de semana se cubrieron <b style="color:'+INK+';">'+Object.keys(state.assignments).length+' de '+(state.selectedCities.length||0)+'</b> ubicaciones '+
        'solicitadas por '+esc(clientName)+', con <b style="color:'+INK+';">'+testigosCount+'</b> evidencias fotográficas confirmadas por las '+
        'promotoras en campo. El reporte de horas y la tabla de dispersión de pago se generan automáticamente al cierre del evento — '+
        'sin que nadie tenga que consolidarlo a mano.'+
      '</div>'+
    '</div>';
}

/* ============ RENDER ============ */
var VIEW_RENDERERS = {
  dashboard: dashboardHTML, calendario: calendarioHTML, nueva: nuevaActivacionHTML,
  asignacion: asignacionHTML, promotoras: promotorasHTML, inventario: inventarioHTML,
  pagos: pagosHTML, vistapromotora: vistaPromotoraHTML, reportes: reportesHTML
};

function render(){
  var renderer = VIEW_RENDERERS[state.view] || dashboardHTML;
  document.getElementById('app').innerHTML = sidebarHTML() + '<main>' + renderer() + '</main>';
}

/* ============ EVENT DELEGATION ============ */
document.getElementById('app').addEventListener('click', function(e){
  var el = e.target.closest('[data-action]');
  if(!el) return;
  var action = el.getAttribute('data-action');

  if(action==='setView'){
    state.view = el.getAttribute('data-view');
  } else if(action==='toggleCity'){
    var city = el.getAttribute('data-city');
    var idx = state.selectedCities.indexOf(city);
    if(idx>=0) state.selectedCities.splice(idx,1); else state.selectedCities.push(city);
  } else if(action==='selectClient'){
    state.selectedClientId = el.getAttribute('data-client');
  } else if(action==='toggleTask'){
    var task = el.getAttribute('data-task');
    var ti = state.taskTypes.indexOf(task);
    if(ti>=0) state.taskTypes.splice(ti,1); else state.taskTypes.push(task);
  } else if(action==='createActivation'){
    if(state.selectedClientId && state.selectedCities.length>0){
      state.activationLive = true;
      state.view = 'inventario';
    }
  } else if(action==='assign'){
    state.assignments[el.getAttribute('data-city')] = parseInt(el.getAttribute('data-promo'),10);
  } else if(action==='setInvCity'){
    state.invCity = el.getAttribute('data-city');
  } else if(action==='bumpInv'){
    var city2 = state.invCity;
    var itemKey = el.getAttribute('data-item');
    var wh = el.getAttribute('data-warehouse');
    state.inv[city2][itemKey][wh] += 1;
  } else if(action==='togglePago'){
    var pc = el.getAttribute('data-city');
    state.pagos[pc] = !state.pagos[pc];
  } else if(action==='uploadTestigo'){
    state.testigos[el.getAttribute('data-city')] = true;
  } else if(action==='setPromoFilter'){
    var pf = el.getAttribute('data-city');
    state.promoFilterCity = pf || null;
  }
  render();
});

render();
</script>
</body>
